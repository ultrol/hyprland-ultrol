# ── hypridle: уход в сон и погашение монитора ───────────────────────────────
# Автоблокировки нет — hyprlock вызывается только по Super+L.

general {
    lock_cmd = pidof hyprlock || hyprlock   # что запускать на блокировку
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 5,5 минуты бездействия — погасить монитор
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}
