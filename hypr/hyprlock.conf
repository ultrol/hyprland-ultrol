# ── Экран блокировки (hyprlock) ──────────────────────────────────────────────
# Структуру/шрифты/позиции правим здесь.
# Цвета ($bg, $fg, $accent …) лежат в hyprlock.colors.conf
# и меняются скриптом rice под обои.

source = ~/.config/hypr/hyprlock.colors.conf

general {
    hide_cursor = true
    immediate_render = true
}

# Обои текущего рабочего стола + мягкое размытие
background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 8
    noise = 0.012
    color = $bg
    vibrancy = 0.2
}

# Время
label {
    monitor =
    text = $TIME
    color = $fg
    font_size = 72
    font_family = JetBrainsMono Nerd Font
    position = 0, 120
    halign = center
    valign = center
}

# Дата
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $muted
    font_size = 18
    font_family = JetBrainsMono Nerd Font
    position = 0, 40
    halign = center
    valign = center
}

# Раскладка клавиатуры
label {
    monitor =
    text = $LAYOUT[en,ru]
    color = $accent2
    font_size = 13
    font_family = JetBrainsMono Nerd Font
    position = 0, -70
    halign = center
    valign = center
}

# Поле ввода пароля
input-field {
    monitor =
    size = 280, 52
    outline_thickness = 2
    dots_size = 0.26
    dots_spacing = 0.3
    outer_color = $accent
    inner_color = $surface
    font_color = $fg
    check_color = $accent2
    fail_color = $critical
    capslock_color = $warning
    position = 0, -20
    halign = center
    valign = center
    rounding = 14
    fade_on_empty = false
    placeholder_text = <i>пароль…</i>
}

